*{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}

.ok{color:var(--green);font-weight:800}.no{color:var(--red);font-weight:800}.note{padding:12px 2px 28px;color:var(--muted);font-size:12px}

const LABELS=["Pos.","Cargo","Responsable","Total activos","Con producción","Sin producción","% Activación","Candado 80%","Op. Agosto","Meta Op.","Prod. Sep.","Tarjetas Sep.","Op. Setiembre","% Cumpl.","Faltantes","Cumple meta"];
let current="bono";
const $=x=>document.getElementById(x);
function pct(v){return v==null||v===""?"—":Number(v).toLocaleString("es-PE",{maximumFractionDigits:2})+"%"}
function num(v){return v==null||v===""?"—":Number(v).toLocaleString("es-PE")}
function source(){return current==="bono"?BONO:RANK}
function fillCargo(){
 let val=$("cargo").value; $("cargo").innerHTML='<option value="">Todos los cargos</option>';
 [...new Set(source().map(x=>x.CARGO).filter(Boolean))].sort().forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=v;$("cargo").appendChild(o)});
 if([...$("cargo").options].some(o=>o.value===val)) $("cargo").value=val;
}
function render(){
 const q=$("q").value.trim().toUpperCase(), c=$("cargo").value;
 const rows=source().filter(r=>(!q||String(r.RESPONSABLE||"").toUpperCase().includes(q))&&(!c||r.CARGO===c));
 $("thead").innerHTML="<tr>"+LABELS.map(x=>"<th>"+x+"</th>").join("")+"</tr>";
 $("tbody").innerHTML=rows.map(r=>"<tr>"+COLS.map((k,i)=>{
   let v=r[k]; if(k==="PCT_ACTIVACION"||k==="PCT_CUMPLIMIENTO") v=pct(v);
   else if(typeof v==="number") v=num(v);
   let cls=(k==="CANDADO_80"||k==="CUMPLE_META_OP")?(String(r[k]).toUpperCase()==="CUMPLE"?"ok":"no"):"";
   return `<td class="${cls}">${v==null?"—":v}</td>`;
 }).join("")+"</tr>").join("");
 $("sreg").textContent=rows.length;
 $("sact").textContent=rows.filter(r=>r.CANDADO_80==="CUMPLE").length;
 $("smeta").textContent=rows.filter(r=>r.CUMPLE_META_OP==="CUMPLE").length;
 const vals=rows.map(r=>Number(r.PCT_CUMPLIMIENTO)).filter(Number.isFinite);
 $("spct").textContent=vals.length?pct(vals.reduce((a,b)=>a+b,0)/vals.length):"—";
 $("note").textContent=current==="bono"?"Hoja Bono: detalle completo de responsables de la campaña.":"Hoja Rankin: responsables incluidos en el ranking del archivo original.";
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");current=b.dataset.sheet;$("q").value="";$("cargo").value="";fillCargo();render()});
